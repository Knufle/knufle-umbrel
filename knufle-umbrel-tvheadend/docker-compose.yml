version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: knufle-umbrel-tvheadend_server_1
      APP_PORT: 9981

  server:
    image: linuxserver/tvheadend:version-8837853a@sha256:989fd717b2b143b8861ab60c31053c1d3542368532af1d429e996fa61e4fc04b
    privileged: true
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/recordings:/recordings

  epg:
    image: python:3.13.13-alpine3.22@sha256:e81548ac35b07a3bd4805f275107592ef458b1e893c0e04d45aedaa19416cca5
    restart: on-failure
    depends_on:
      - server
    command: python /app/epg-server.py
    environment:
      - TVHEADEND_URL=http://server:9981
      - TVHEADEND_PUBLIC_URL=http://knufle-umbrel-tvheadend_server_1:9981
      - BIND_PORT=9983
    volumes:
      - ${APP_DATA_DIR}/epg-server.py:/app/epg-server.py:ro
