version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: knufle-umbrel-dispatcharr_server_1
      APP_PORT: 9191

  server:
    image: ghcr.io/dispatcharr/dispatcharr:0.34.1-20261124235450@sha256:afd70c7964568f2375cd7536d88895af5bb2b11ffc17ea8034c65ff0a02137f3
    restart: on-failure
    environment:
      - DISPATCHARR_ENV=aio
      - REDIS_HOST=localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DISPATCHARR_LOG_LEVEL=info
      - TZ=America/Sao_Paulo
    ports:
      - "9191:9191"
    volumes:
      - ${APP_DATA_DIR}/data:/data
